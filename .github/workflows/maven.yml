name: GitHub CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      MAVEN_OPTS: "-DskipTests=true -Dmaven.javadoc.skip=true"
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Fix JAVA_HOME on macOS
      if: runner.os == 'macOS'
      run: echo "JAVA_HOME=$JAVA_HOME/Contents/Home" >> $GITHUB_ENV
    - name: Build with Maven
      run: mvn clean package -B -V
